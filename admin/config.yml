backend:
  name: github
  repo: flozer/flozer.github.io
  branch: main
  base_url: https://decap-oauth.fernandolozer.workers.dev
  auth_endpoint: /auth

# Configuração de mídia (imagens)
media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

# Configuração de publicação (desabilitado para publicação direta)
# publish_mode: editorial_workflow

# Configuração de locale
locale: pt

# Collections (tipos de conteúdo)
collections:
  # Posts do blog
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} | {{status}} | {{date}}"
    sortable_fields: ['title', 'date', 'status', 'featured']
    view_filters:
      - label: "Rascunhos"
        field: status
        pattern: 'rascunho'
      - label: "Em Revisão"
        field: status
        pattern: 'revisao'
      - label: "Publicados"
        field: status
        pattern: 'publicado'
      - label: "Posts em Destaque"
        field: featured
        pattern: true
    editor:
      preview: true
    fields:
      # ===== METADADOS PRINCIPAIS =====
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }

      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título do post (claro e descritivo)"

      - label: "Data de Publicação"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        hint: "Data e hora de publicação"

      # ===== CATEGORIZAÇÃO =====
      - label: "Categorias"
        name: "categories"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Power BI"
          - "DAX"
          - "Scripts"
          - "Tutoriais"
          - "Análise de Dados"
          - "IA"
          - "Tecnologia"
          - "Otimização"
          - "Boas Práticas"
        hint: "Escolha uma ou mais categorias"

      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - "dax"
          - "powerbi"
          - "scripts"
          - "tutorial"
          - "dax-studio"
          - "otimizacao"
          - "python"
          - "excel"
          - "power-query"
          - "introducao"
          - "intermediario"
          - "avancado"
          - "produtividade"
          - "atalhos"
          - "ia"
          - "machine-learning"
        hint: "Escolha tags relevantes (minúsculas, separadas por hífen)"

      # ===== IMAGEM E SEO =====
      - label: "Imagem de Capa"
        name: "image"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Imagem"
            name: "path"
            widget: "image"
            required: false
            hint: "Faça upload de uma imagem ou cole URL do Unsplash"
            media_library:
              config:
                max_file_size: 512000
          - label: "Texto Alternativo"
            name: "alt"
            widget: "string"
            required: false
            hint: "Descrição da imagem para acessibilidade e SEO"

      - label: "Descrição (SEO)"
        name: "description"
        widget: "text"
        required: false
        hint: "Resumo do post para motores de busca (150-160 caracteres ideais)"
        pattern: ['.{0,160}', "Máximo de 160 caracteres"]

      - label: "Post em Destaque?"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Marcar como post importante/destacado"

      - label: "Status do Post"
        name: "status"
        widget: "select"
        required: false
        default: "rascunho"
        options:
          - { label: "📝 Rascunho", value: "rascunho" }
          - { label: "✏️ Em Revisão", value: "revisao" }
          - { label: "✅ Publicado", value: "publicado" }
        hint: "Controle pessoal do estado do post"

      # ===== CONTEÚDO =====
      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
        hint: "Use Markdown para formatar o conteúdo"
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list

  # Páginas estáticas
  - name: "pages"
    label: "Páginas"
    files:
      - label: "Sobre"
        name: "about"
        file: "_tabs/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Ícone", name: "icon", widget: "string", default: "fas fa-info-circle" }
          - { label: "Ordem", name: "order", widget: "number", default: 4 }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown" }
