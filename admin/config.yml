# Configuração do Sveltia CMS › https://sveltiacms.app/en/docs

backend:
  name: github
  repo: flozer/flozer.github.io
  branch: main
  base_url: https://decap-oauth.fernandolozer.workers.dev
  auth_endpoint: /auth

# Fluxo editorial: cada post novo ou editado vira uma branch + pull request
# (Rascunho → Em revisão → Pronto). Só vai para a main (e para o site) ao publicar.
publish_mode: editorial_workflow

# Configuração de mídia (imagens)
media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

media_libraries:
  default:
    config:
      max_file_size: 512000 # 500 KB
      slugify_filename: true # nomes de arquivo sem espaços/acentos

# Slugs (nomes de arquivo e URLs) só com ASCII: "Introdução ao Git" → "introducao-ao-git"
slug:
  encoding: ascii
  clean_accents: true
  timezone: local

# Não grava campos opcionais vazios (ex.: "image: {path: ''}" quebraria o card na home do Chirpy)
output:
  omit_empty_optional_fields: true

# Collections (tipos de conteúdo)
collections:
  # Posts do blog
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "_posts"
    create: true
    # O Jekyll exige o prefixo AAAA-MM-DD no nome do arquivo
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    sortable_fields: ["date", "title"]
    editor:
      preview: true
    fields:
      # ===== METADADOS PRINCIPAIS =====
      # (layout: post já vem dos defaults do _config.yml)
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título do post (claro e descritivo)"

      - label: "Data de Publicação"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        hint: "Data e hora de publicação"

      # ===== CATEGORIZAÇÃO =====
      - label: "Categorias"
        name: "categories"
        widget: "list"
        required: false
        hint: "Uma por linha (Enter adiciona outra). Ex.: Power BI, DAX, Scripts, Tutoriais, Git, IA"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Minúsculas, com hífen, sem barra. Ex.: dax, powerbi, power-query, git, ci-cd"

      # ===== IMAGEM E SEO =====
      - label: "Imagem de Capa"
        name: "image"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Imagem"
            name: "path"
            widget: "image"
            required: false
            hint: "Faça upload de uma imagem (até 500 KB) ou cole uma URL"
          - label: "Texto Alternativo"
            name: "alt"
            widget: "string"
            required: false
            hint: "Descrição da imagem para acessibilidade e SEO"

      - label: "Descrição (SEO)"
        name: "description"
        widget: "text"
        required: false
        hint: "Resumo do post para motores de busca (150-160 caracteres ideais)"
        pattern: ['^.{0,160}$', "Máximo de 160 caracteres"]

      - label: "Fixar no Topo?"
        name: "pin"
        widget: "boolean"
        default: false
        required: false
        hint: "Fixa o post no topo da página inicial"

      - label: "Publicado no site?"
        name: "published"
        widget: "boolean"
        default: true
        required: false
        hint: "Rascunhos ficam no fluxo editorial. Desmarque só para tirar do ar um post já publicado"

      # ===== CONTEÚDO =====
      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
        # Markdown puro por padrão: preserva a sintaxe do Chirpy ({: .prompt-tip }, {% include %}, ---)
        modes: ["raw", "rich_text"]
        hint: "Modo Markdown preserva {: .prompt-tip } e {% include %}. Evite o modo visual em posts que usam essa sintaxe"

  # Páginas estáticas
  - name: "pages"
    label: "Páginas"
    files:
      - label: "Sobre"
        name: "about"
        file: "_tabs/about.md"
        fields:
          - { label: "Ícone", name: "icon", widget: "string", default: "fas fa-info-circle" }
          - { label: "Ordem", name: "order", widget: "number", default: 4 }
          - { label: "Título", name: "title", widget: "string", required: false }
          - { label: "Conteúdo", name: "body", widget: "markdown", modes: ["raw", "rich_text"] }
